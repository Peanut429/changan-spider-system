# /etc/nginx/sites-available/changan.conf
# 所有页面和 API 都挂在 /changan-data/ 下，nginx 原样转发（不剥前缀），
# 前缀由应用自己处理：apps/web/.env 里 BASE_PATH=/changan-data，
# 构建后路由、静态资源、fetch、favicon 都自带这个前缀。
#
# 关键点：proxy_pass 末尾不要加 /，加了就会把 /changan-data 剥掉，导致 404。

upstream changan_web {
    server 127.0.0.1:3010;
    keepalive 32;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 账号导入等上传接口
    client_max_body_size 50m;

    access_log /var/log/nginx/changan.access.log;
    error_log  /var/log/nginx/changan.error.log;

    # 少了结尾斜杠时补一下，否则应用的相对资源会解析到根路径
    location = /changan-data {
        return 301 /changan-data/;
    }

    # 内容哈希文件，长缓存
    location /changan-data/assets/ {
        proxy_pass http://changan_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /changan-data/ {
        proxy_pass http://changan_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /changan-data;

        # 报表/导出类接口可能跑得久，默认 60s 太短
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

