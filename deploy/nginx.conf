# /etc/nginx/sites-available/changan.conf
# 放到服务器后：ln -s ../sites-available/changan.conf /etc/nginx/sites-enabled/
# 把 example.com 换成真实域名；先只开 80，跑通 certbot 后再启用 443 段。
#
# 说明：Nitro 产物（apps/web/.output）自己会返回 /assets/* 静态文件，
# 所以这里只做反代 + 边缘缓存，不需要 alias 到磁盘目录。

upstream changan_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# gzip 配置若已在 /etc/nginx/nginx.conf 里有，可删掉这一段
gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 账号导入等上传接口
    client_max_body_size 50m;

    access_log /var/log/nginx/changan.access.log;
    error_log  /var/log/nginx/changan.error.log;

    # 内容哈希文件，长缓存
    location /assets/ {
        proxy_pass http://changan_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://changan_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 报表/导出类接口可能跑得久，默认 60s 太短
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSR 页面不缓存，避免内容和登录态串味
        proxy_buffering on;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

